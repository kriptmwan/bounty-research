[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 1000000
via_ir = true
evm_version = "cancun"
allow_paths = ["../repos/aa"]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "account-abstraction/=../repos/aa/",
]
